# OpticBin - Ultralytics YOLOv8 Waste Detection Dataset Configuration
# 3-class degradability taxonomy for home waste sorting.

path: dataset_yolo      # Dataset root directory (relative to project root or absolute)
train: images/train     # Train images (relative to 'path')
val: images/val         # Validation images (relative to 'path')
test: images/test       # Optional test images (relative to 'path')

# 3 Home Waste Sorting Categories
names:
  0: biodegradable
  1: non-biodegradable
  2: e-waste
